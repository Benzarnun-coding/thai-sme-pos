<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoopDesk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F4F9; --panel:#FFFFFF; --panel-2:#F5F6FB; --ink:#1B2033; --ink-2:#4B5270; --muted:#8A90A8;
  --line:#E4E7F0; --line-2:#D3D7E4;
  --brand:#24306B; --brand-ink:#FFFFFF; --brand-soft:#E8ECFA; --brand-text:#24306B;
  --thread:#E8A33D; --thread-ink:#2A1E05; --thread-soft:#FBF0DA;
  --fb:#2a78d6; --shopee:#eb6834; --tiktok:#1baf7a; --line-ch:#3fbf5f;
  --good:#1E8E3E; --warn:#C77700; --crit:#D93A3A;
  --good-soft:#E4F4E8; --warn-soft:#FBEFD6; --crit-soft:#FBE3E3;
  --grid:#EAECF3;
  --shadow:0 1px 2px rgba(27,32,51,.04),0 8px 24px -12px rgba(27,32,51,.18);
  --shadow-lg:0 2px 4px rgba(27,32,51,.05),0 18px 40px -16px rgba(27,32,51,.28);
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111420; --panel:#1A1E2D; --panel-2:#222739; --ink:#EEF0F7; --ink-2:#C0C5D8; --muted:#7F869E;
    --line:#2A3043; --line-2:#363D55;
    --brand:#4E63D8; --brand-ink:#FFFFFF; --brand-soft:#28305A; --brand-text:#B7C3FF;
    --thread:#F0B45A; --thread-ink:#2A1E05; --thread-soft:#3B2E14;
    --fb:#3987e5; --shopee:#d95926; --tiktok:#199e70; --line-ch:#3fbf5f;
    --good:#5CC271; --warn:#E3A13A; --crit:#F07676;
    --good-soft:#1B2F22; --warn-soft:#352A14; --crit-soft:#3B2020;
    --grid:#262C3F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 2px 4px rgba(0,0,0,.35),0 18px 40px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111420; --panel:#1A1E2D; --panel-2:#222739; --ink:#EEF0F7; --ink-2:#C0C5D8; --muted:#7F869E;
  --line:#2A3043; --line-2:#363D55;
  --brand:#4E63D8; --brand-ink:#FFFFFF; --brand-soft:#28305A; --brand-text:#B7C3FF;
  --thread:#F0B45A; --thread-ink:#2A1E05; --thread-soft:#3B2E14;
  --fb:#3987e5; --shopee:#d95926; --tiktok:#199e70; --line-ch:#3fbf5f;
  --good:#5CC271; --warn:#E3A13A; --crit:#F07676;
  --good-soft:#1B2F22; --warn-soft:#352A14; --crit-soft:#3B2020;
  --grid:#262C3F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.35),0 18px 40px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.6}
h1,h2,h3,h4,.display{font-family:'Mitr','IBM Plex Sans Thai',sans-serif;font-weight:500;text-wrap:balance;margin:0;letter-spacing:.005em}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-text)}
:focus-visible{outline:3px solid var(--thread);outline-offset:2px;border-radius:6px}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--panel);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
.brand{padding:16px 20px 10px;display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;border-radius:13px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:'Mitr';font-weight:600;font-size:15px;position:relative;flex:none}
.brand .logo::after{content:"";position:absolute;inset:4px;border:1.5px dashed var(--thread);border-radius:9px;opacity:.9}
.brand h1{font-size:20px;font-weight:600;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:'IBM Plex Mono';margin-top:3px}
.store{padding:4px 14px 10px;display:flex;flex-direction:column;gap:4px}
.store .eyebrow{padding-left:6px}
.store select{padding:9px 34px 9px 12px;font-weight:500;font-family:'Mitr';border-radius:var(--r-sm)}
.nav{display:flex;flex-direction:column;padding:4px 12px 8px;gap:2px;overflow-y:auto}
.nav-sec{font-size:11px;letter-spacing:.06em;color:var(--muted);padding:8px 12px 2px;font-family:'Mitr';font-weight:500}
.nav-sec:first-child{padding-top:4px}
.nav button{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:0;padding:7px 12px;font-size:14px;font-weight:500;color:var(--ink-2);border-radius:12px;transition:background .12s,color .12s,transform .12s}
.nav button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav button .k{display:none}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.nav button.on{background:var(--brand);color:var(--brand-ink)}
.nav button.on svg{opacity:1}
.nav .badge{margin-left:auto;font-family:'IBM Plex Mono';font-size:11px;background:var(--crit);color:#fff;padding:1px 8px;border-radius:999px;font-weight:500}
.nav button.on .badge{background:var(--thread);color:var(--thread-ink)}
.rail-foot{margin-top:auto;padding:10px 20px;border-top:1px dashed var(--line-2);font-size:12px;color:var(--muted);line-height:1.5}
.rail-foot b{color:var(--ink);font-weight:500}

.main{min-width:0}
.topbar{display:flex;align-items:center;gap:16px;padding:18px 28px;position:sticky;top:0;z-index:5;flex-wrap:wrap;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar h2{font-size:24px;font-weight:600;line-height:1.15}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.topbar .grow{flex:1}
.content{padding:8px 28px 72px;display:flex;flex-direction:column;gap:22px;max-width:1380px}

/* ---- primitives ---- */
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.panel-h{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;flex-wrap:wrap}
.panel-h h3{font-size:17px}
.panel-h .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-b{padding:6px 20px 20px}
.eyebrow{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{background:var(--panel);border:1px solid var(--line-2);padding:9px 16px;font-weight:500;border-radius:999px;transition:transform .12s,box-shadow .12s,background .12s;white-space:nowrap;font-family:'Mitr';box-shadow:0 1px 0 rgba(27,32,51,.04)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.danger{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.btn.good{background:var(--good);color:#fff;border-color:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--panel-2);color:var(--ink-2);white-space:nowrap;font-weight:500;line-height:1.5}
.chip.fb{background:var(--fb);color:#fff}
.chip.shopee{background:var(--shopee);color:#fff}
.chip.tiktok{background:var(--tiktok);color:#fff}
.chip.line{background:var(--line-ch);color:#fff}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.acc{background:var(--thread-soft);color:var(--warn)}
.dot{width:8px;height:8px;display:inline-block;background:currentColor;border-radius:50%}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--brand-soft);opacity:.7}
.kpi:nth-child(2)::before{background:var(--good-soft)}
.kpi:nth-child(3)::before{background:var(--thread-soft)}
.kpi:nth-child(4)::before{background:var(--crit-soft)}
.kpi > *{position:relative}
.kpi .v{font-family:'Mitr';font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:400}
.kpi .d{font-size:13px;color:var(--ink-2)}
.meter{height:10px;border-radius:999px;background:var(--panel-2);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0;right:auto;background:var(--brand);border-radius:999px;transition:width .4s}
.meter.warn i{background:var(--warn)}.meter.crit i{background:var(--crit)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td, table tr:hover td{background:color-mix(in srgb,var(--panel-2) 60%,transparent)}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono';font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;padding:0 6px 8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.in{background:var(--panel-2);border:1px solid transparent;padding:10px 12px;width:100%;min-width:0;border-radius:var(--r-sm);transition:border-color .12s,background .12s}
.in:hover{border-color:var(--line-2)}
.in:focus{outline:none;background:var(--panel);border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.in{min-height:100px;resize:vertical;line-height:1.6}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.tog input{position:absolute;opacity:0;width:0;height:0}
.tog .sw{width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tog input:checked + .sw{background:var(--good)}
.tog input:checked + .sw::after{transform:translateX(18px)}
.tog input:focus-visible + .sw{outline:3px solid var(--thread);outline-offset:2px}
.tog.big .sw{width:58px;height:32px}.tog.big .sw::after{width:26px;height:26px}.tog.big input:checked + .sw{background:var(--thread)}.tog.big input:checked + .sw::after{transform:translateX(26px)}
.range{display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;accent-color:var(--brand)}
.stack{display:flex;flex-direction:column;gap:12px}
.hr{border:0;border-top:1px solid var(--line);margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.tabs button{background:transparent;border:0;padding:7px 16px;font-weight:500;font-size:13px;border-radius:999px;color:var(--ink-2);font-family:'Mitr'}
.tabs button.on{background:var(--brand);color:var(--brand-ink)}
.log{font-family:'IBM Plex Mono';font-size:12px;background:var(--brand);color:#EEF0F7;padding:14px 16px;line-height:1.8;max-height:280px;overflow:auto;border-radius:var(--r-sm)}
:root[data-theme="dark"] .log{background:#0F1220}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .log{background:#0F1220} }
.log .t{color:#9BA6D6}.log .ok{color:#8CE0A0}.log .wn{color:#F0B45A}.log .er{color:#FF9A9A}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;box-shadow:var(--shadow-lg);font-weight:500;z-index:20;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;font-family:'Mitr'}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- loop track ---- */
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;padding:18px 12px 10px;position:relative}
.pipe::before{content:"";position:absolute;left:calc(100%/14);right:calc(100%/14);top:46px;border-top:2px dashed var(--line-2)}
.step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 8px;position:relative}
.step .ball{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:'Mitr';font-weight:600;font-size:16px;background:var(--panel-2);color:var(--muted);border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line-2);position:relative;transition:transform .15s}
.step:hover .ball{transform:scale(1.06)}
.step .n{font-family:'Mitr';font-weight:500;font-size:13px;letter-spacing:.04em;margin-top:4px}
.step .th{font-size:12px;color:var(--ink-2);line-height:1.4;min-height:34px}
.step .st{margin-top:2px}
.step .time{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted)}
.step.done .ball{background:var(--good);color:#fff;box-shadow:0 0 0 2px var(--good)}
.step.run .ball{background:var(--thread);color:var(--thread-ink);box-shadow:0 0 0 2px var(--thread)}
.step.run .ball::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--thread);opacity:0;animation:pulse 1.6s ease-out infinite}
.step.hold .ball{background:var(--warn-soft);color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
@keyframes pulse{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.step.run .ball::after{animation:none}}

/* ---- inbox cards ---- */
.card{display:grid;grid-template-columns:160px 1fr auto;gap:20px;padding:20px;border-bottom:1px solid var(--line)}
.card:last-child{border-bottom:0}
.thumb{aspect-ratio:1;border-radius:14px;background:linear-gradient(160deg,#4A63B8 0%,#24306B 100%);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.thumb::before{content:"";position:absolute;inset:8px;border:1.5px dashed rgba(240,180,90,.75);border-radius:9px;pointer-events:none}
.thumb .price{font-family:'Mitr';font-weight:600;font-size:22px;background:var(--thread);color:var(--thread-ink);padding:0 10px;width:max-content;border-radius:8px;line-height:1.5}
.thumb .nm{font-family:'Mitr';font-weight:500;font-size:13px;margin-top:6px;line-height:1.3}
.thumb .ratio{position:absolute;top:10px;right:10px;font-family:'IBM Plex Mono';font-size:10px;background:rgba(255,255,255,.18);padding:1px 6px;border-radius:6px;backdrop-filter:blur(4px)}
.thumb.v{aspect-ratio:9/16;max-height:190px}
.copy{width:100%;min-height:90px;background:var(--panel-2);border:1px solid transparent;padding:12px 14px;line-height:1.65;resize:vertical;border-radius:var(--r-sm);font-size:14.5px}
.copy:focus{outline:none;background:var(--panel);border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.acts{display:flex;flex-direction:column;gap:8px;min-width:150px}
.acts .btn{width:100%}
.qa{display:flex;gap:6px;flex-wrap:wrap}

/* ---- connectors ---- */
.conn{display:flex;flex-direction:column}
.conn .top{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.conn .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:'Mitr';font-weight:600;color:#fff;font-size:14px;flex:none}
.conn .caps{display:grid;grid-template-columns:1fr auto;gap:10px 12px;padding:16px 20px;align-items:center}
.conn .caps .cn{font-size:14px}
.conn .caps .cd{font-size:11px;color:var(--muted)}

/* ---- chart ---- */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-family:'IBM Plex Mono';font-size:11px;padding:8px 10px;border-radius:10px;white-space:nowrap;display:none;z-index:3;line-height:1.6;box-shadow:var(--shadow-lg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend i{width:10px;height:10px;display:inline-block;margin-right:6px;vertical-align:-1px;border-radius:3px}

/* ---- calendar ---- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;padding:12px}
.day{padding:6px;border-right:1px dashed var(--line);display:flex;flex-direction:column;gap:8px;min-height:220px}
.day:last-child{border-right:0}
.dh{font-family:'Mitr';font-weight:500;font-size:13px;color:var(--ink-2);padding:2px 4px 6px}
.ev{background:var(--panel-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--line-2);cursor:grab}
.ev.fb{border-left-color:var(--fb)}.ev.tiktok{border-left-color:var(--tiktok)}.ev.shopee{border-left-color:var(--shopee)}
.ev:hover{box-shadow:var(--shadow)}
.et{font-size:13px;line-height:1.4}
.heat{display:grid;grid-template-columns:44px repeat(6,1fr);gap:4px}
.heat .hh,.heat .hd{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono';display:flex;align-items:center;justify-content:center}
.heat .hd{justify-content:flex-start}
.heat .hc{height:26px;border-radius:6px}
/* ---- chat ---- */
.msg{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.msg:last-child{border-bottom:0}
.bub{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.55;max-width:92%}
.bub.in{background:var(--panel-2);align-self:flex-start;border-bottom-left-radius:4px}
.bub.ai{background:var(--brand-soft);color:var(--ink);align-self:flex-end;border-bottom-right-radius:4px;position:relative}
.bub.ai::before{content:"AI";position:absolute;top:-8px;right:10px;font-size:9px;font-family:'IBM Plex Mono';background:var(--brand);color:#fff;padding:0 6px;border-radius:6px}
.linebub{background:#DCF2D0;color:#1B2033;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.7;max-width:420px;border-bottom-left-radius:4px}
/* ---- creative ---- */
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 20px 20px}
.tpl{display:flex;flex-direction:column;gap:4px}
.tpl-img{aspect-ratio:1;border-radius:12px;background:linear-gradient(160deg,#4A63B8,#24306B);position:relative;display:flex;align-items:flex-end;padding:10px;box-shadow:var(--shadow)}
.tpl-img::before{content:"";position:absolute;inset:7px;border:1.5px dashed rgba(240,180,90,.7);border-radius:8px}
.tpl-img.v{aspect-ratio:9/16;max-height:150px}
.tpl-img .price{font-family:'Mitr';font-weight:600;font-size:16px;background:var(--thread);color:var(--thread-ink);padding:0 8px;border-radius:7px;position:relative}
.tpl-n{font-family:'Mitr';font-weight:500;font-size:14px;margin-top:4px}
.idea{padding:12px 14px;border-radius:12px;background:var(--panel-2)}
/* ---- catalog ---- */
.skugrid{display:grid;gap:4px}
.skugrid .hh,.skugrid .hd{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono';display:flex;align-items:center;justify-content:center}
.skugrid .hd{justify-content:flex-start;font-family:'IBM Plex Sans Thai';color:var(--ink-2)}
.sq{height:34px;border-radius:8px;background:var(--good-soft);color:var(--good);display:grid;place-items:center;font-family:'IBM Plex Mono';font-size:12px;font-weight:500}
.sq.low{background:var(--warn-soft);color:var(--warn)}
.sq.zero{background:var(--crit-soft);color:var(--crit)}

.matrix{display:grid;grid-template-columns:1.4fr repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.matrix > div{padding:12px 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;align-items:center}
.matrix > div:nth-child(4n){border-right:0}
.matrix > .h{background:var(--panel-2);font-size:12px;color:var(--muted);font-weight:500}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}

  .rail-foot{display:none}

  .g3,.g2{grid-template-columns:1fr}
  .pipe{grid-template-columns:repeat(4,1fr);row-gap:18px}
  .cal{grid-template-columns:1fr}
  .day{border-right:0;border-bottom:1px dashed var(--line);min-height:auto}
  .tpls{grid-template-columns:repeat(2,1fr)}

  .content{padding:4px 16px 72px;gap:16px}
}

function pipeline(compact){
  return `<div class="pipe">${S.steps.map((s,i)=>`

function statusChip(s){
  const m={done:['good','เสร็จ '+s.last+' · '+s.dur],run:['acc','กำลังรัน · '+s.last],hold:['warn','รอคนอนุมัติ · '+s.dur],wait:['','รอรอบถัดไป']};

}

/* =========================================================

const dayLbl = d => d.getDate()+' '+['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][d.getMonth()];
function chartBars(){
  const chs=activeCh(); const W=560,H=220,L=44,R=8,T=10,B=26;
  const tot=DAYS.map((_,i)=>chs.reduce((s,c)=>s+SPEND[c][i],0));
  const raw=Math.max(S.settings.dailyCap, ...tot)*1.05; const pw=Math.pow(10,Math.floor(Math.log10(raw/4))); const stepB=[1,2,2.5,5,10].map(m=>m*pw).find(v=>raw/v<=5);
  const max=Math.ceil(raw/stepB)*stepB; const y=v=>T+(H-T-B)*(1-v/max); const bw=(W-L-R)/14;
  const ticks=[]; for(let t=0;t<=max;t+=stepB) ticks.push(t);
  let g='';
  ticks.forEach(t=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono">${t>=1000?(t/1000)+'k':t}</text>`; });
  const capY=y(S.settings.dailyCap);
  g+=`<line x1="${L}" x2="${W-R}" y1="${capY}" y2="${capY}" stroke="var(--crit)" stroke-dasharray="4 3" stroke-width="1.5"/><text x="${W-R}" y="${capY-4}" text-anchor="end" font-size="10" fill="var(--crit)" font-family="IBM Plex Mono">cap ${fmt(S.settings.dailyCap)}</text>`;
  DAYS.forEach((d,i)=>{ let acc=0; const x=L+i*bw+bw*0.2, w=bw*0.6;
    chs.forEach(c=>{ const v=SPEND[c][i]; if(!v) return; const y1=y(acc+v), y0=y(acc);
      g+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0,y0-y1-2)}" rx="3" fill="var(${CH[c].var})"/>`; acc+=v; });
    if(i%2===1) g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono">${d.getDate()}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>`;
  });
  const data=DAYS.map((d,i)=>({l:dayLbl(d),rows:chs.map(c=>[CH[c].name,thb(SPEND[c][i])]).concat([['รวม',thb(tot[i])]])}));
  return `<div class="chart" data-chart='${esc(JSON.stringify(data))}'><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="งบโฆษณาต่อวันแยกช่องทาง 14 วัน">${g}</svg><div class="tip"></div></div>
  <div class="legend" style="margin-top:8px">${chs.map(c=>`<span><i style="background:var(${CH[c].var})"></i>${CH[c].name}</span>`).join('')}<span><i style="background:transparent;border-top:2px dashed var(--crit);height:0"></i>cap ต่อวัน</span></div>`;
}
function chartLine(){
  const W=560,H=220,L=44,R=8,T=10,B=26;
  const lo=Math.min(...SALES,SALES_BASE), hi=Math.max(...SALES,SALES_BASE); const step=Math.pow(10,Math.floor(Math.log10(hi-lo)))*((hi-lo)/Math.pow(10,Math.floor(Math.log10(hi-lo)))>5?2:1);
  const min=Math.floor(lo/step)*step, max=Math.ceil(hi/step)*step; const y=v=>T+(H-T-B)*(1-(v-min)/(max-min)); const x=i=>L+i*(W-L-R)/13;
  let g=''; const ticks=[]; for(let t=min;t<=max;t+=step) ticks.push(t);
  ticks.forEach(t=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono">${(t/1000).toFixed(t%1000?1:0)}k</text>`; });
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(SALES_BASE)}" y2="${y(SALES_BASE)}" stroke="var(--muted)" stroke-dasharray="4 3"/>`;
  const pts=SALES.slice(0,13).map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  g+=`<polygon points="${x(0)},${y(min)} ${pts} ${x(12)},${y(min)}" fill="var(--brand)" opacity=".10"/>`;
  g+=`<polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  g+=`<line x1="${x(12)}" y1="${y(SALES[12])}" x2="${x(13)}" y2="${y(SALES[13])}" stroke="var(--brand)" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>`;
  g+=`<circle cx="${x(12)}" cy="${y(SALES[12])}" r="5" fill="var(--thread)" stroke="var(--panel)" stroke-width="2.5"/>`;
  g+=`<text x="${x(12)}" y="${y(SALES[12])-10}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono" fill="var(--ink)" font-weight="500">${fmt(SALES[12])}</text>`;
  g+=`<text x="${x(13)}" y="${y(SALES[13])+14}" text-anchor="end" font-size="10" font-family="IBM Plex Mono" fill="var(--muted)">วันนี้ (บางส่วน)</text>`;
  DAYS.forEach((d,i)=>{ if(i%2===1) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono">${d.getDate()}</text>`;
    const hw=(W-L-R)/13; g+=`<rect class="hit" data-i="${i}" x="${x(i)-hw/2}" y="${T}" width="${hw}" height="${H-T-B}" fill="transparent"/>`; });
  const data=DAYS.map((d,i)=>({l:dayLbl(d),rows:[['ยอดขาย',thb(SALES[i])],['เทียบ baseline',(SALES[i]>=SALES_BASE?'+':'')+Math.round((SALES[i]/SALES_BASE-1)*100)+'%']]}));
  return `<div class="chart" data-chart='${esc(JSON.stringify(data))}'><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ยอดขาย POS ต่อวัน 14 วัน">${g}</svg><div class="tip"></div></div>
  <div class="legend" style="margin-top:8px"><span><i style="background:var(--brand)"></i>ยอดขายรวมทุกช่องทาง (หน้าร้าน + Shopee + TikTok Shop)</span><span><i style="background:transparent;border-top:2px dashed var(--muted);height:0"></i>baseline ${thb(SALES_BASE)}</span></div>`;
}
function bindCharts(){
  document.querySelectorAll('.chart').forEach(ch=>{
    const data=JSON.parse(ch.dataset.chart); const tip=ch.querySelector('.tip');
    ch.querySelectorAll('.hit').forEach(h=>{
      h.addEventListener('mouseenter',e=>{ const d=data[+h.dataset.i]; tip.innerHTML=`<b>${d.l}</b><br>${d.rows.map(r=>r[0]+': '+r[1]).join('<br>')}`; tip.style.display='block'; });
      h.addEventListener('mousemove',e=>{ const r=ch.getBoundingClientRect(); let lx=e.clientX-r.left+12, ly=e.clientY-r.top-10; if(lx+tip.offsetWidth>r.width) lx-=tip.offsetWidth+24; tip.style.left=lx+'px'; tip.style.top=ly+'px'; });
      h.addEventListener('mouseleave',()=>tip.style.display='none');
    });
  });
}

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

document.addEventListener('input',e=>{
  const el=e.target; const p=el.dataset.bind; if(!p) return;
  let v = el.type==='checkbox'?el.checked : el.dataset.num? Number(el.value) : el.value;
  set(p,v);
  if(el.dataset.out) document.getElementById(el.dataset.out).textContent=Number(v).toFixed(1);
  if(el.type==='checkbox' && el.dataset.rerender) render();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.action==='catsel'){ S.catSel=el.value; save(); render(); return; }
  if(el.id==='store-sel'){ if(el.value==='__add'){ const n=prompt('ชื่อร้านใหม่'); if(n){ addStore(n.trim(), prompt('ประเภทร้าน (เช่น ร้านอาหาร, เสื้อผ้า)')||''); } else { el.value=ALL.current; } } else switchStore(el.value); return; } if(el.dataset.bind && el.dataset.rerender && el.type!=='checkbox') render();
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action;
  if(a==='go'){ e.preventDefault(); S.view=el.dataset.view; save(); render(); window.scrollTo(0,0); }
  else if(a==='inboxfilter'){ S.inboxFilter=el.dataset.f; save(); render(); }
  else if(a==='approve'||a==='reject'){ const it=S.inbox.find(i=>i.id===el.dataset.id); it.status=a==='approve'?'approved':'rejected'; save(); render(); toast(a==='approve'?'อนุมัติแล้ว · เข้าคิว PUBLISH':'ปฏิเสธแล้ว · ส่ง feedback ให้ AI'); }
  else if(a==='approveall'){ pending().forEach(i=>i.status='approved'); save(); render(); toast('อนุมัติทั้งหมดแล้ว · เข้าคิว PUBLISH'); }
  else if(a==='regen'){ toast('ส่งให้ Copywriter เขียนใหม่ · ประมาณ 40 วินาที (mock)'); }
  else if(a==='kill'){ if(confirm('หยุดแอดทุกตัวในทุกช่องทางทันที?')){ S.placements.forEach(p=>{ if(p.status==='active') p.status='paused'; }); S.settings.autopilot=false; save(); render(); toast('หยุดทุกแอดแล้ว · Autopilot ปิด'); } }
  else if(a==='pause'){ const p=S.placements[+el.dataset.i]; p.status=p.status==='active'?'paused':'active'; save(); render(); }
  else if(a==='applydec'){ const p=S.placements[+el.dataset.i]; if(p.decision==='kill'){p.status='paused';} else {p.spend=Math.round(p.spend*(1+S.settings.scalePct/100));} p.decision='hold'; save(); render(); toast('ทำตามข้อเสนอ AI แล้ว'); }
  else if(a==='connect'){ const c=S.channels[el.dataset.k]; c.connected=true; c.tokenDays=90; c.account='เชื่อมต่อแล้ว (mock)'; save(); render(); toast('เชื่อมต่อสำเร็จ (mock)'); }
  else if(a==='toast'){ toast(el.dataset.msg); }
  else if(a==='addstore'){ const n=prompt('ชื่อร้านใหม่'); if(n) addStore(n.trim(), prompt('ประเภทร้าน (เช่น ร้านอาหาร, เสื้อผ้า)')||''); }
  else if(a==='switchstore'){ switchStore(el.dataset.id); }
  else if(a==='delstore'){ if(confirm('ลบร้านนี้?')){ delete ALL.stores[el.dataset.id]; delete STORES[el.dataset.id]; switchStore('climax'); } }
  else if(a==='runloop'){ toast('เริ่มรัน loop ทั้ง 7 ขั้น (mock)'); S.steps.forEach(s=>s.status='run'); render(); setTimeout(()=>{ S.steps.forEach((s,i)=>s.status=i<3?'done':i===3?'hold':'wait'); render(); },1500); }
  else if(a==='runstep'){ const s=S.steps[+el.dataset.i]; s.status='run'; render(); setTimeout(()=>{ s.status='done'; s.last='ตอนนี้'; save(); render(); toast(s.name+' เสร็จแล้ว (mock)'); },1200); }
  else if(a==='tooltoggle'){ const ag=S.agents[+el.dataset.i], t=el.dataset.t; const k=ag.tools.indexOf(t); k>=0?ag.tools.splice(k,1):ag.tools.push(t); save(); render(); }
  else if(a==='resetagent'){ S.agents[+el.dataset.i]=clone(DEFAULTS.agents[+el.dataset.i]); save(); render(); toast('คืนค่าเริ่มต้นแล้ว'); }
  else if(a==='resetall'){ if(confirm('คืนค่าร้านนี้เป็นค่าเริ่มต้น?')){ const id=ALL.current; ALL.stores[id]=storeDefaults(id); if(!STORES[id].kb) ALL.stores[id]._custom=STORES[id]; ALL.stores[id].view='settings'; switchStore(id); toast('คืนค่าเริ่มต้นแล้ว'); } }
});
document.getElementById('foot-date').textContent='6 ก.ย. 2569';
applyStore();
render();
</script>
