<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoopDesk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EDECE5; --panel:#FFFFFF; --panel-2:#F6F5F0; --ink:#141414; --ink-2:#4A4944; --muted:#87857C;
  --line:#141414; --line-soft:#D9D7CE; --shadow:#141414;
  --accent:#F2C216; --accent-ink:#141414; --accent-soft:#FBF0BE;
  --fb:#2a78d6; --shopee:#eb6834; --tiktok:#1baf7a; --line-ch:#3fbf5f;
  --good:#008300; --warn:#eda100; --crit:#e34948;
  --good-soft:#E3F3E3; --warn-soft:#FBEFD2; --crit-soft:#FBE1E1;
  --grid:#E5E3DA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#151514; --panel:#1E1E1C; --panel-2:#262624; --ink:#F2F1EA; --ink-2:#C3C2B7; --muted:#8B8A82;
    --line:#5A5955; --line-soft:#333330; --shadow:#0A0A09;
    --accent:#F2C216; --accent-ink:#141414; --accent-soft:#3D3410;
    --fb:#3987e5; --shopee:#d95926; --tiktok:#199e70; --line-ch:#3fbf5f;
    --good:#4FB84F; --warn:#c98500; --crit:#e66767;
    --good-soft:#1C2E1C; --warn-soft:#332A12; --crit-soft:#3A1F1F;
    --grid:#2C2C29;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151514; --panel:#1E1E1C; --panel-2:#262624; --ink:#F2F1EA; --ink-2:#C3C2B7; --muted:#8B8A82;
  --line:#5A5955; --line-soft:#333330; --shadow:#0A0A09;
  --accent:#F2C216; --accent-ink:#141414; --accent-soft:#3D3410;
  --fb:#3987e5; --shopee:#d95926; --tiktok:#199e70; --line-ch:#3fbf5f;
  --good:#4FB84F; --warn:#c98500; --crit:#e66767;
  --good-soft:#1C2E1C; --warn-soft:#332A12; --crit-soft:#3A1F1F;
  --grid:#2C2C29;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3,h4,.display{font-family:'Chakra Petch','IBM Plex Sans Thai',sans-serif;text-wrap:balance;margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.rail{border-right:3px solid var(--line);background:var(--panel);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:3px solid var(--line);display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;background:var(--accent);border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);display:grid;place-items:center;font-family:'Chakra Petch';font-weight:700;font-size:15px;color:var(--accent-ink)}
.brand h1{font-size:18px;font-weight:700;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:'IBM Plex Mono'}
.store{padding:12px 12px 4px;display:flex;flex-direction:column;gap:4px}
.store select{padding:6px 8px;font-weight:600;font-family:'Chakra Petch'}
.nav{display:flex;flex-direction:column;padding:10px;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:3px solid transparent;padding:9px 10px;font-weight:500;color:var(--ink-2)}
.nav button .k{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);width:18px}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.nav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--line);box-shadow:3px 3px 0 var(--shadow)}
.nav button.on .k{color:var(--accent-ink)}
.nav .badge{margin-left:auto;font-family:'IBM Plex Mono';font-size:11px;background:var(--crit);color:#fff;padding:0 6px;border:2px solid var(--line)}
.rail-foot{margin-top:auto;padding:14px;border-top:3px solid var(--line);font-size:12px;color:var(--muted)}
.rail-foot b{color:var(--ink);font-family:'IBM Plex Mono';font-weight:500}

.main{min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:3px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.topbar h2{font-size:20px;font-weight:700}
.topbar .sub{color:var(--muted);font-size:12px}
.topbar .grow{flex:1}
.content{padding:22px 24px 60px;display:flex;flex-direction:column;gap:20px;max-width:1380px}

/* ---- primitives ---- */
.panel{background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:3px solid var(--line)}
.panel-h h3{font-size:15px;font-weight:600}
.panel-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-b{padding:16px}
.eyebrow{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{background:var(--panel);border:3px solid var(--line);padding:7px 12px;font-weight:600;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--crit);color:#fff}
.btn.good{background:var(--good);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px;box-shadow:2px 2px 0 var(--shadow)}
.btn.ghost{box-shadow:none;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono';font-size:11px;padding:2px 8px;border:2px solid var(--line);background:var(--panel-2);white-space:nowrap}
.chip.fb{background:var(--fb);color:#fff;border-color:transparent}
.chip.shopee{background:var(--shopee);color:#fff;border-color:transparent}
.chip.tiktok{background:var(--tiktok);color:#fff;border-color:transparent}
.chip.line{background:var(--line-ch);color:#fff;border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.acc{background:var(--accent);color:var(--accent-ink)}
.dot{width:8px;height:8px;display:inline-block;background:currentColor}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:'IBM Plex Mono';font-size:28px;font-weight:500;line-height:1.1}
.kpi .v small{font-size:14px;color:var(--muted)}
.kpi .d{font-size:12px;color:var(--ink-2)}
.meter{height:10px;border:2px solid var(--line);background:var(--panel-2);position:relative}
.meter i{position:absolute;inset:0;right:auto;background:var(--accent)}
.meter.warn i{background:var(--warn)}.meter.crit i{background:var(--crit)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:3px solid var(--line);font-weight:500}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono';font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:11px;color:var(--muted)}
.in{background:var(--panel);border:3px solid var(--line);padding:7px 10px;width:100%;min-width:0}
.in:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.tog input{position:absolute;opacity:0;width:0;height:0}
.tog .sw{width:40px;height:22px;border:3px solid var(--line);background:var(--panel-2);position:relative;flex:none}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--line)}
.tog input:checked + .sw{background:var(--accent)}
.tog input:checked + .sw::after{left:auto;right:2px;background:var(--accent-ink)}
.tog input:focus-visible + .sw{outline:3px solid var(--accent);outline-offset:2px}
.tog.big .sw{width:56px;height:30px}.tog.big .sw::after{width:18px;height:18px;top:3px;left:3px}.tog.big input:checked + .sw::after{right:3px}
.range{display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;accent-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
.hr{border:0;border-top:3px solid var(--line);margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.tabs{display:flex;gap:0;border:3px solid var(--line);width:max-content;max-width:100%;overflow-x:auto}
.tabs button{background:var(--panel);border:0;border-right:3px solid var(--line);padding:6px 12px;font-weight:600;font-size:12px}
.tabs button:last-child{border-right:0}
.tabs button.on{background:var(--ink);color:var(--bg)}
.log{font-family:'IBM Plex Mono';font-size:12px;background:var(--ink);color:var(--bg);padding:12px 14px;line-height:1.7;max-height:260px;overflow:auto}
.log .t{color:#9A9890}.log .ok{color:#7FD67F}.log .wn{color:#F2C216}.log .er{color:#FF8A8A}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border:3px solid var(--accent);box-shadow:4px 4px 0 var(--shadow);font-weight:600;z-index:20;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.show{opacity:1}

/* loop pipeline */
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border:3px solid var(--line);background:var(--panel)}
.step{padding:12px;border-right:3px solid var(--line);display:flex;flex-direction:column;gap:6px;min-height:150px;position:relative}
.step:last-child{border-right:0}
.step .n{font-family:'Chakra Petch';font-weight:700;font-size:13px;letter-spacing:.04em}
.step .th{font-size:12px;color:var(--ink-2)}
.step .st{margin-top:auto}
.step.done{background:var(--good-soft)}
.step.run{background:var(--accent-soft)}
.step.wait{background:var(--panel)}
.step.hold{background:var(--warn-soft)}
.step.done::before,.step.run::before,.step.hold::before{content:"";position:absolute;left:0;right:0;top:0;height:5px}
.step.done::before{background:var(--good)}.step.run::before{background:var(--accent)}.step.hold::before{background:var(--warn)}

/* inbox cards */
.card{display:grid;grid-template-columns:150px 1fr auto;gap:16px;padding:16px;border-bottom:3px solid var(--line)}
.card:last-child{border-bottom:0}
.thumb{aspect-ratio:1;border:3px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;position:relative;overflow:hidden}
.thumb .price{font-family:'Chakra Petch';font-weight:700;font-size:20px;background:var(--accent);color:var(--accent-ink);padding:0 6px;width:max-content;border:2px solid var(--line)}
.thumb .nm{font-family:'Chakra Petch';font-weight:600;font-size:12px;margin-top:4px}
.thumb .ratio{position:absolute;top:6px;right:6px;font-family:'IBM Plex Mono';font-size:10px;background:var(--panel);border:2px solid var(--line);padding:0 4px}
.thumb.v{aspect-ratio:9/16;max-height:160px}
.copy{width:100%;min-height:80px;background:var(--panel-2);border:3px solid var(--line);padding:8px 10px;line-height:1.55;resize:vertical}
.acts{display:flex;flex-direction:column;gap:8px;min-width:120px}
.qa{display:flex;gap:6px;flex-wrap:wrap}

/* connectors */
.conn{display:flex;flex-direction:column}
.conn .top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:3px solid var(--line)}
.conn .ico{width:38px;height:38px;border:3px solid var(--line);display:grid;place-items:center;font-family:'Chakra Petch';font-weight:700;color:#fff;font-size:13px}
.conn .caps{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 16px;align-items:center}
.conn .caps .cn{font-size:13px}
.conn .caps .cd{font-size:11px;color:var(--muted)}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-family:'IBM Plex Mono';font-size:11px;padding:6px 8px;border:2px solid var(--accent);white-space:nowrap;display:none;z-index:3;line-height:1.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{width:10px;height:10px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* matrix */
.matrix{display:grid;grid-template-columns:1.4fr repeat(3,1fr);border:3px solid var(--line)}
.matrix > div{padding:10px 12px;border-bottom:2px solid var(--line-soft);border-right:2px solid var(--line-soft);display:flex;align-items:center}
.matrix > div:nth-child(4n){border-right:0}
.matrix > .h{background:var(--panel-2);font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:3px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto}
  .nav button{white-space:nowrap}
  .rail-foot{display:none}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3,.g2{grid-template-columns:1fr}
  .pipe{grid-template-columns:repeat(2,1fr)}
  .step{border-bottom:3px solid var(--line)}
  .card{grid-template-columns:1fr}
  .thumb{max-width:160px}
  .matrix{grid-template-columns:1fr}
  .matrix > div{border-right:0}
  .content{padding:16px 14px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <div class="brand">
      <div class="logo">LD</div>
      <div><h1>LoopDesk</h1><small>AI Marketing Loop</small></div>

    <div class="store"><span class="eyebrow">ร้านค้า</span><select class="in" id="store-sel" data-action="store"></select></div>

</div>
<div class="toast" id="toast"></div>

function storeDefaults(id){
  const st=STORES[id]; const d=clone(DEFAULTS); d.storeId=id; d.kb=clone(st.kb);
  for(const c of ['facebook','tiktok','shopee']) d.channels[c].account=st.accounts[c];
  if(id!=='benz'){
    const map={}; BASE_PIDS.forEach((b,i)=>map[b]=st.products[i].id);
    const HOOK={'คำถาม':p=>`หา${p.name}ที่ใส่แล้วพอดีตัวจริง ๆ อยู่ใช่ไหม? 👖\nไซส์ ${p.sizes} ${p.note} ตัวละ ${p.price}.-\nทักมาบอกส่วนสูง/น้ำหนัก เราช่วยเลือกไซส์ให้`,'บอกราคา':p=>`${p.price} บาท ${p.name}\nไซส์ ${p.sizes} · ${p.note} · เปลี่ยนไซส์ได้ใน 7 วัน\nซื้อ 2 ตัวส่งฟรี ถึงวันอาทิตย์นี้`,'เล่าเรื่อง':p=>`[Script 15s]\n0-3s: hook "ทรงนี้คนสูง 160 ใส่แล้วเป็นยังไง?"\n3-10s: ใส่จริง เดิน นั่ง โชว์เอวและปลายขา\n10-15s: ${p.name} ${p.price}.- ไซส์ ${p.sizes} กดตะกร้า`};
    d.inbox.forEach(i=>{ i.product=map[i.product]; const p=st.products.find(x=>x.id===i.product); i.copy=HOOK[i.hookType](p); i.reason=`ยอดขาย ${p.trend>=0?'+':''}${p.trend}% ใน 7 วัน · สต็อก ${p.stock==='high'?'เหลือเยอะ':'ปกติ'}`; i.budget=i.budget?Math.round(i.budget*st.factor/10)*10:0; });
    d.placements.forEach(pl=>{ pl.product=map[pl.product]; const p=st.products.find(x=>x.id===pl.product); pl.name=pl.name.replace(/\] [^·]+ ·/,'] '+p.name+' ·'); pl.spend=Math.round(pl.spend*st.factor/10)*10; pl.imp=Math.round(pl.imp*st.factor); pl.clicks=Math.round(pl.clicks*st.factor); });
    d.settings.dailyCap=Math.round(1500*st.factor/100)*100; d.settings.monthlyCap=d.settings.dailyCap*20;
    if(id==='branch2') d.settings.brandVoice='โทนเป็นกันเองแบบพ่อค้าตลาดนัด บอกวันและจุดออกบูธทุกโพสต์ ชวนมาลองไซส์ที่ร้าน ใส่ emoji ได้ 1 ตัว';
    if(id==='wholesale') d.settings.brandVoice='โทนมืออาชีพ ตรงประเด็น บอกราคาต่อตัวเมื่อซื้อยกโหล ขั้นต่ำ และรอบส่งของ ไม่ใช้ emoji ปิดท้ายด้วย "ทักแชทขอแคตตาล็อก"';
  }
  return d;
}
function loadAll(){
  let a=null; try{ const j=localStorage.getItem(KEY); if(j) a=JSON.parse(j);}catch(e){}
  if(!a||!a.stores){ a={current:'benz',stores:{}}; }
  for(const id in STORES){ if(!a.stores[id]) a.stores[id]=storeDefaults(id); else a.stores[id]=merge(storeDefaults(id),a.stores[id]); }
  for(const id in a.stores){ if(!STORES[id]){ if(a.stores[id]._custom) STORES[id]=a.stores[id]._custom; else delete a.stores[id]; } }
  if(!a.stores[a.current]) a.current='benz';
  for(const id of ['nara','somchai']) delete a.stores[id];
  return a;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ALL)); }catch(e){} }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function merge(a,b){ for(const k in b){ if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'){ merge(a[k],b[k]); } else a[k]=b[k]; } return a; }
function switchStore(id){ ALL.current=id; S=ALL.stores[id]; applyStore(); save(); render(); }
function addStore(name,type){
  const id='s'+Date.now().toString(36); const tpl=clone(STORES.benz); tpl.name=name; tpl.type=type||'ร้านใหม่'; tpl.kb=[];
  tpl.accounts={facebook:name+' (Page)',tiktok:'@'+name.toLowerCase().replace(/\s+/g,''),shopee:name.toLowerCase().replace(/\s+/g,'')+'.shop'};
  STORES[id]=tpl; const d=storeDefaults(id); d._custom=tpl; d.inbox=[]; d.placements=[]; d.kb=[];
  for(const c in d.channels) d.channels[c].connected=false;
  ALL.stores[id]=d; switchStore(id); toast('เพิ่มร้าน '+name+' แล้ว · เชื่อมต่อช่องทางได้ที่หน้า "ช่องทาง"');
}
function get(path){ return path.split('.').reduce((o,k)=>o?.[k],S); }
function set(path,v){ const ks=path.split('.'); const last=ks.pop(); const o=ks.reduce((o,k)=>o[k],S); o[last]=v; save(); }

function pipeline(compact){
  return `<div class="pipe">${S.steps.map((s,i)=>`
    <div class="step ${s.status}">
      <div class="n">${i+1}. ${s.name}</div>
      <div class="th">${s.th}</div>

      <div class="st">${statusChip(s)}</div>
    </div>`).join('')}</div>`;
}
function statusChip(s){
  const m={done:['good','เสร็จ '+s.last+' · '+s.dur],run:['acc','กำลังรัน · '+s.last],hold:['warn','รอคนอนุมัติ · '+s.dur],wait:['','รอรอบถัดไป']};
  const [c,t]=m[s.status]; return `<span class="chip ${c}">${t}</span>`;
}

        <span class="chip ${mode==='auto'?'acc':''}">${mode==='auto'?'จะออกอัตโนมัติ':mode==='notify'?'แจ้งเตือน · ออกเองถ้าไม่ปฏิเสธใน 2 ชม.':'ต้องกดอนุมัติ'}</span></div>

const dayLbl = d => d.getDate()+' '+['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][d.getMonth()];
function chartBars(){
  const chs=activeCh(); const W=560,H=220,L=44,R=8,T=10,B=26;
  const tot=DAYS.map((_,i)=>chs.reduce((s,c)=>s+SPEND[c][i],0));
  const max=Math.max(S.settings.dailyCap, ...tot)*1.05;
  const y=v=>T+(H-T-B)*(1-v/max); const bw=(W-L-R)/14;
  const ticks=[0,0.25,0.5,0.75,1].map(f=>Math.round(max*f/100)*100);
  let g='';
  ticks.forEach(t=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono">${t>=1000?(t/1000)+'k':t}</text>`; });
  const capY=y(S.settings.dailyCap);
  g+=`<line x1="${L}" x2="${W-R}" y1="${capY}" y2="${capY}" stroke="var(--crit)" stroke-dasharray="4 3" stroke-width="1.5"/><text x="${W-R}" y="${capY-4}" text-anchor="end" font-size="10" fill="var(--crit)" font-family="IBM Plex Mono">cap ${fmt(S.settings.dailyCap)}</text>`;
  DAYS.forEach((d,i)=>{ let acc=0; const x=L+i*bw+bw*0.2, w=bw*0.6;
    chs.forEach(c=>{ const v=SPEND[c][i]; if(!v) return; const y1=y(acc+v), y0=y(acc);
      g+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0,y0-y1-2)}" fill="var(${CH[c].var})"/>`; acc+=v; });
    if(i%2===1) g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono">${d.getDate()}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>`;
  });
  const data=DAYS.map((d,i)=>({l:dayLbl(d),rows:chs.map(c=>[CH[c].name,thb(SPEND[c][i])]).concat([['รวม',thb(tot[i])]])}));
  return `<div class="chart" data-chart='${esc(JSON.stringify(data))}'><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="งบโฆษณาต่อวันแยกช่องทาง 14 วัน">${g}</svg><div class="tip"></div></div>
  <div class="legend" style="margin-top:8px">${chs.map(c=>`<span><i style="background:var(${CH[c].var})"></i>${CH[c].name}</span>`).join('')}<span><i style="background:transparent;border-top:2px dashed var(--crit);height:0"></i>cap ต่อวัน</span></div>`;
}
function chartLine(){
  const W=560,H=220,L=44,R=8,T=10,B=26;
  const lo=Math.min(...SALES,SALES_BASE), hi=Math.max(...SALES,SALES_BASE); const step=Math.pow(10,Math.floor(Math.log10(hi-lo)))*((hi-lo)/Math.pow(10,Math.floor(Math.log10(hi-lo)))>5?2:1);
  const min=Math.floor(lo/step)*step, max=Math.ceil(hi/step)*step; const y=v=>T+(H-T-B)*(1-(v-min)/(max-min)); const x=i=>L+i*(W-L-R)/13;
  let g=''; const ticks=[]; for(let t=min;t<=max;t+=step) ticks.push(t);
  ticks.forEach(t=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono">${(t/1000).toFixed(t%1000?1:0)}k</text>`; });
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(SALES_BASE)}" y2="${y(SALES_BASE)}" stroke="var(--muted)" stroke-dasharray="4 3"/>`;
  const pts=SALES.slice(0,13).map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  g+=`<polygon points="${x(0)},${y(min)} ${pts} ${x(12)},${y(min)}" fill="var(--accent)" opacity=".18"/>`;
  g+=`<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
  g+=`<line x1="${x(12)}" y1="${y(SALES[12])}" x2="${x(13)}" y2="${y(SALES[13])}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 3"/>`;
  g+=`<circle cx="${x(12)}" cy="${y(SALES[12])}" r="4.5" fill="var(--accent)" stroke="var(--ink)" stroke-width="2"/>`;
  g+=`<text x="${x(12)}" y="${y(SALES[12])-10}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono" fill="var(--ink)">${fmt(SALES[12])}</text>`;
  g+=`<text x="${x(13)}" y="${y(SALES[13])+14}" text-anchor="end" font-size="10" font-family="IBM Plex Mono" fill="var(--muted)">วันนี้ (บางส่วน)</text>`;
  DAYS.forEach((d,i)=>{ if(i%2===1) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono">${d.getDate()}</text>`;
    const hw=(W-L-R)/13; g+=`<rect class="hit" data-i="${i}" x="${x(i)-hw/2}" y="${T}" width="${hw}" height="${H-T-B}" fill="transparent"/>`; });
  const data=DAYS.map((d,i)=>({l:dayLbl(d),rows:[['ยอดขาย',thb(SALES[i])],['เทียบ baseline',(SALES[i]>=SALES_BASE?'+':'')+Math.round((SALES[i]/SALES_BASE-1)*100)+'%']]}));
  return `<div class="chart" data-chart='${esc(JSON.stringify(data))}'><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ยอดขาย POS ต่อวัน 14 วัน">${g}</svg><div class="tip"></div></div>
  <div class="legend" style="margin-top:8px"><span><i style="background:var(--ink)"></i>ยอดขายรวมทุกช่องทาง (หน้าร้าน + Shopee + TikTok Shop)</span><span><i style="background:transparent;border-top:2px dashed var(--muted);height:0"></i>baseline ${thb(SALES_BASE)}</span></div>`;
}
function bindCharts(){
  document.querySelectorAll('.chart').forEach(ch=>{
    const data=JSON.parse(ch.dataset.chart); const tip=ch.querySelector('.tip');
    ch.querySelectorAll('.hit').forEach(h=>{
      h.addEventListener('mouseenter',e=>{ const d=data[+h.dataset.i]; tip.innerHTML=`<b>${d.l}</b><br>${d.rows.map(r=>r[0]+': '+r[1]).join('<br>')}`; tip.style.display='block'; });
      h.addEventListener('mousemove',e=>{ const r=ch.getBoundingClientRect(); let lx=e.clientX-r.left+12, ly=e.clientY-r.top-10; if(lx+tip.offsetWidth>r.width) lx-=tip.offsetWidth+24; tip.style.left=lx+'px'; tip.style.top=ly+'px'; });
      h.addEventListener('mouseleave',()=>tip.style.display='none');
    });
  });
}

/* =========================================================
   RENDER + EVENTS
   ========================================================= */
const VIEWS={overview:vOverview,loop:vLoop,inbox:vInbox,campaigns:vCampaigns,channels:vChannels,agents:vAgents,settings:vSettings};
function render(){
  const pend=pending().length;
  document.getElementById('nav').innerHTML=NAV.map(([k,l,n])=>`<button class="${S.view===k?'on':''}" data-action="go" data-view="${k}"><span class="k">${n}</span>${l}${k==='inbox'&&pend?`<span class="badge">${pend}</span>`:''}</button>`).join('');
  const sel=document.getElementById('store-sel');
  sel.innerHTML=Object.keys(ALL.stores).map(id=>`<option value="${id}" ${ALL.current===id?'selected':''}>${esc(STORES[id].name)}</option>`).join('')+'<option value="__add">＋ เพิ่มร้านใหม่…</option>';
  document.getElementById('foot-store').textContent=STORES[ALL.current].name+' · '+STORES[ALL.current].type;
  const [t,sub]=TITLES[S.view]; document.getElementById('ttl').textContent=t; document.getElementById('sub').textContent=sub;
  document.querySelector('[data-bind="settings.autopilot"]').checked=S.settings.autopilot;
  document.getElementById('content').innerHTML=VIEWS[S.view]();
  bindCharts();
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

document.addEventListener('input',e=>{
  const el=e.target; const p=el.dataset.bind; if(!p) return;
  let v = el.type==='checkbox'?el.checked : el.dataset.num? Number(el.value) : el.value;
  set(p,v);
  if(el.dataset.out) document.getElementById(el.dataset.out).textContent=Number(v).toFixed(1);
  if(el.type==='checkbox' && el.dataset.rerender) render();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='store-sel'){ if(el.value==='__add'){ const n=prompt('ชื่อร้านใหม่'); if(n){ addStore(n.trim(), prompt('ประเภทร้าน (เช่น ร้านอาหาร, เสื้อผ้า)')||''); } else { el.value=ALL.current; } } else switchStore(el.value); return; } if(el.dataset.bind && el.dataset.rerender && el.type!=='checkbox') render();
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action;
  if(a==='go'){ e.preventDefault(); S.view=el.dataset.view; save(); render(); window.scrollTo(0,0); }
  else if(a==='inboxfilter'){ S.inboxFilter=el.dataset.f; save(); render(); }
  else if(a==='approve'||a==='reject'){ const it=S.inbox.find(i=>i.id===el.dataset.id); it.status=a==='approve'?'approved':'rejected'; save(); render(); toast(a==='approve'?'อนุมัติแล้ว · เข้าคิว PUBLISH':'ปฏิเสธแล้ว · ส่ง feedback ให้ AI'); }
  else if(a==='approveall'){ pending().forEach(i=>i.status='approved'); save(); render(); toast('อนุมัติทั้งหมดแล้ว · เข้าคิว PUBLISH'); }
  else if(a==='regen'){ toast('ส่งให้ Copywriter เขียนใหม่ · ประมาณ 40 วินาที (mock)'); }
  else if(a==='kill'){ if(confirm('หยุดแอดทุกตัวในทุกช่องทางทันที?')){ S.placements.forEach(p=>{ if(p.status==='active') p.status='paused'; }); S.settings.autopilot=false; save(); render(); toast('หยุดทุกแอดแล้ว · Autopilot ปิด'); } }
  else if(a==='pause'){ const p=S.placements[+el.dataset.i]; p.status=p.status==='active'?'paused':'active'; save(); render(); }
  else if(a==='applydec'){ const p=S.placements[+el.dataset.i]; if(p.decision==='kill'){p.status='paused';} else {p.spend=Math.round(p.spend*(1+S.settings.scalePct/100));} p.decision='hold'; save(); render(); toast('ทำตามข้อเสนอ AI แล้ว'); }
  else if(a==='connect'){ const c=S.channels[el.dataset.k]; c.connected=true; c.tokenDays=90; c.account='benzcafe · เชื่อมต่อแล้ว (mock)'; save(); render(); toast('เชื่อมต่อสำเร็จ (mock)'); }
  else if(a==='toast'){ toast(el.dataset.msg); }
  else if(a==='addstore'){ const n=prompt('ชื่อร้านใหม่'); if(n) addStore(n.trim(), prompt('ประเภทร้าน (เช่น ร้านอาหาร, เสื้อผ้า)')||''); }
  else if(a==='switchstore'){ switchStore(el.dataset.id); }
  else if(a==='delstore'){ if(confirm('ลบร้านนี้?')){ delete ALL.stores[el.dataset.id]; delete STORES[el.dataset.id]; switchStore('benz'); } }
  else if(a==='runloop'){ toast('เริ่มรัน loop ทั้ง 7 ขั้น (mock)'); S.steps.forEach(s=>s.status='run'); render(); setTimeout(()=>{ S.steps.forEach((s,i)=>s.status=i<3?'done':i===3?'hold':'wait'); render(); },1500); }
  else if(a==='runstep'){ const s=S.steps[+el.dataset.i]; s.status='run'; render(); setTimeout(()=>{ s.status='done'; s.last='ตอนนี้'; save(); render(); toast(s.name+' เสร็จแล้ว (mock)'); },1200); }
  else if(a==='tooltoggle'){ const ag=S.agents[+el.dataset.i], t=el.dataset.t; const k=ag.tools.indexOf(t); k>=0?ag.tools.splice(k,1):ag.tools.push(t); save(); render(); }
  else if(a==='resetagent'){ S.agents[+el.dataset.i]=clone(DEFAULTS.agents[+el.dataset.i]); save(); render(); toast('คืนค่าเริ่มต้นแล้ว'); }
  else if(a==='resetall'){ if(confirm('คืนค่าร้านนี้เป็นค่าเริ่มต้น?')){ const id=ALL.current; ALL.stores[id]=storeDefaults(id); if(!STORES[id].kb) ALL.stores[id]._custom=STORES[id]; ALL.stores[id].view='settings'; switchStore(id); toast('คืนค่าเริ่มต้นแล้ว'); } }
});
document.getElementById('foot-date').textContent='6 ก.ย. 2569';
applyStore();
render();
</script>
